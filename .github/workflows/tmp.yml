name: test-temp-repo

on:
  workflow_dispatch:

env:
  QUAY_TEMP_REPO: quay.io/yezib/verltest

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to Quay Temp
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: yezib+usrbot
          password: GU6JW3AAFZ8A94TPKY6PS7Y0JBI95PLNG1US992ZJ8ZBY785YG5JWDAIV22X6G47

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/ascend/Dockerfile.ascend_9.1.0_a3
          platforms: linux/amd64
          push: true
          tags: ${{ env.QUAY_TEMP_REPO }}:test-ci-${{ github.run_id }}
